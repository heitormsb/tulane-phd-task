    <linearGradient id="mtile6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8EABE5"/><stop offset="1" stop-color="#B5CAF2"/>
    </linearGradient>
    <linearGradient id="mtile7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0DA99E"/><stop offset="1" stop-color="#25C2B4"/>
    </linearGradient>
    <linearGradient id="mtile8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9CAEF"/><stop offset="1" stop-color="#DCE5FF"/>
    </linearGradient>
    <linearGradient id="mtile9" x1="0" y1="0" x2="1" y2="1">
