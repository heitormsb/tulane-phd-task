<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo Tessila — original</title>
  <desc id="desc">Identidade visual oficial da Tessila, baseada nas referências aprovadas.</desc>
  <defs>

    <linearGradient id="mwordDark" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#101B48"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mtile0" x1="0" y1="0" x2="1" y2="1">
