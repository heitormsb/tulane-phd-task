    <rect x="6" y="42.5" width="20" height="20" rx="4.1" fill="url(#mtile5)" filter="url(#mtileShadow)"/>
    <rect x="31" y="42.5" width="20" height="20" rx="4.1" fill="url(#mtile6)" filter="url(#mtileShadow)"/>
    <rect x="56" y="42.5" width="20" height="20" rx="4.1" fill="url(#mtile7)" filter="url(#mtileShadow)"/>
    <rect x="81" y="42.5" width="20" height="20" rx="4.1" fill="url(#mtile8)" filter="url(#mtileShadow)"/>
    <rect x="106" y="42.5" width="20" height="20" rx="4.1" fill="url(#mtile9)" filter="url(#mtileShadow)"/>
    <rect x="56" y="67.5" width="20" height="20" rx="4.1" fill="url(#mstem)" filter="url(#mtileShadow)"/>
    <rect x="56" y="92.5" width="20" height="20" rx="4.1" fill="url(#mstem)" filter="url(#mtileShadow)"/>
